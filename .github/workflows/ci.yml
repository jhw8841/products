name: CI Build
on:
  push:                          # runs on every push, any branch
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:             # "Run workflow" button in the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    container: python:3.11-slim  # match your .devcontainer/Dockerfile

    services:
      postgres:
        image: postgres:15-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: pgs3cr3t
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Install system tools          # slim image lacks git/curl; codecov needs them
        run: apt-get update && apt-get install -y git curl gpg

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install pipenv
          pipenv install --system --dev      # or: pip install -r requirements.txt

      - name: Lint
        run: |
          flake8 service tests --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 service tests --count --max-complexity=10 --max-line-length=127 --statistics

      - name: Run tests with coverage
        run: pytest --cov=service --cov-report=xml --disable-warnings
        env:
          DATABASE_URI: "postgresql+psycopg://postgres:pgs3cr3t@postgres:5432/testdb"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}   # your fork's token (Actions secret)
          files: ./coverage.xml
          fail_ci_if_error: true                # surface upload problems while testing